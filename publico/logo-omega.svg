<!--
  Símbolo da Omega (dois círculos entrelaçados).

  ESTE ARQUIVO É UM PLACEHOLDER FIEL, NÃO O ARQUIVO OFICIAL.
  Quando a Omega te mandar o logo original, substitua este arquivo
  mantendo o mesmo nome (publico/logo-omega.svg) e o site inteiro
  passa a usar o oficial, sem mexer em mais nada.

  O símbolo é branco porque no site ele sempre aparece sobre a
  faixa azul-marinho da marca.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 64" role="img" aria-label="Omega">
  <circle cx="25" cy="32" r="16" fill="none" stroke="#FFFFFF" stroke-width="10" />
  <circle cx="45" cy="32" r="17" fill="none" stroke="#FFFFFF" stroke-width="6" />
</svg>
