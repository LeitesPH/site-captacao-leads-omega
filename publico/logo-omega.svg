<!--
  Logo da Omega Diagnóstico Odontológico.

  Arquivo oficial enviado pelo cliente. No original a logo era o buraco de
  uma chapa preta; aqui a chapa foi removida usando o próprio desenho como
  máscara, então sobra só a logo, com fundo transparente de verdade e os
  miolos das letras vazados. O enquadramento também foi fechado no desenho,
  tirando a margem vazia que o arquivo tinha em volta.

  A logo sai branca porque no site ela aparece sempre sobre o azul-marinho
  da marca. Para outra cor, troque o fill do retângulo de baixo.

  Proporção: 557 x 146 (aproximadamente 3,8 : 1).
-->
